<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Save to Koi</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header>
        <div>
          <p class="eyebrow">Koi capture</p>
          <h1>Save visual references</h1>
        </div>
        <img class="mark" src="brand-mark.svg" alt="" aria-hidden="true" />
      </header>

      <section class="destination-card" aria-labelledby="destination-title">
        <div class="section-head">
          <h2 id="destination-title">Save location</h2>
          <span id="bridge-state">Connecting to Koi…</span>
        </div>
        <label class="field" for="destination-folder">
          <span>Folder</span>
          <select id="destination-folder" disabled>
            <option value="">Koi Captures</option>
          </select>
        </label>
        <details class="capture-settings">
          <summary>Capture settings</summary>
          <label class="check-row" for="ask-every-time">
            <input id="ask-every-time" type="checkbox" checked />
            <span>
              <strong>Ask where to save</strong>
              <small>Choose a Koi folder in this popup before each capture.</small>
            </span>
          </label>
          <label class="field quick-save-field" for="quick-save-folder">
            <span>Quick Save folder</span>
            <select id="quick-save-folder" disabled>
              <option value="">Koi Captures</option>
            </select>
          </label>
        </details>
      </section>

      <section id="page-card" class="page-card" aria-labelledby="page-title">
        <div class="preview-wrap">
          <img id="page-preview" alt="" hidden />
          <div id="preview-placeholder" class="preview-placeholder" aria-hidden="true">No preview</div>
        </div>
        <div class="page-copy">
          <p id="site-name" class="site-name">Current page</p>
          <h2 id="page-title">Loading page…</h2>
        </div>
        <button id="save-page" class="primary" type="button" disabled>Save page preview</button>
      </section>

      <section aria-labelledby="images-title">
        <div class="section-head">
          <h2 id="images-title">Images on this page</h2>
          <span id="image-count"></span>
        </div>
        <div id="image-grid" class="image-grid"></div>
        <p id="empty-images" class="empty" hidden>No downloadable images found on this page.</p>
      </section>

      <p class="hint">Tip: right-click any image and select “Save image to Koi.”</p>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </main>
    <script src="popup.js" type="module"></script>
  </body>
</html>
