<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Save to Koi</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header>
        <div>
          <p class="eyebrow">Koi capture</p>
          <h1>Save visual references</h1>
        </div>
        <span class="mark" aria-hidden="true">K</span>
      </header>

      <section id="page-card" class="page-card" aria-labelledby="page-title">
        <div class="preview-wrap">
          <img id="page-preview" alt="" hidden />
          <div id="preview-placeholder" class="preview-placeholder" aria-hidden="true">No preview</div>
        </div>
        <div class="page-copy">
          <p id="site-name" class="site-name">Current page</p>
          <h2 id="page-title">Loading page…</h2>
        </div>
        <button id="save-page" class="primary" type="button" disabled>Save page preview</button>
      </section>

      <section aria-labelledby="images-title">
        <div class="section-head">
          <h2 id="images-title">Images on this page</h2>
          <span id="image-count"></span>
        </div>
        <div id="image-grid" class="image-grid"></div>
        <p id="empty-images" class="empty" hidden>No downloadable images found on this page.</p>
      </section>

      <p class="hint">Tip: right-click any image and select “Save image to Koi.”</p>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </main>
    <script src="popup.js" type="module"></script>
  </body>
</html>
