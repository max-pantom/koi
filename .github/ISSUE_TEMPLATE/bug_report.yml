name: Bug report
description: Tell us about something that is not working as expected.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to help improve Koi.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Tell us what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can we reproduce it?
      placeholder: |
        1. Open…
        2. Select…
        3. See…
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Koi version
      placeholder: 0.2.0
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Operating system
      placeholder: macOS 15.1, Windows 11, or Ubuntu 24.04
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Where did this happen?
      options:
        - Desktop app
        - Chrome extension
        - Both
        - Somewhere else
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Anything else?
      description: Add screenshots, recordings, logs, or other useful context. Please remove private information first.
