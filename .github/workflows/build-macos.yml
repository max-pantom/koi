name: Build desktop release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to rebuild and attach assets to (for example, v0.1.10)
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  prepare-release:
    name: Prepare GitHub release
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Ensure target release exists
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          gh release view "${TARGET_TAG}" >/dev/null 2>&1 || \
            gh release create "${TARGET_TAG}" \
              --draft \
              --title "Koi ${TARGET_TAG}" \
              --notes-file "docs/release-notes/${TARGET_TAG}.md"

  build-desktop:
    name: ${{ matrix.name }}
    needs: prepare-release
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            platform: macos-latest
            rust_targets: aarch64-apple-darwin
            tauri_args: --target aarch64-apple-darwin --bundles app,dmg
          - name: macOS Intel
            platform: macos-latest
            rust_targets: x86_64-apple-darwin
            tauri_args: --target x86_64-apple-darwin --bundles app,dmg
          - name: Windows x64
            platform: windows-latest
            rust_targets: x86_64-pc-windows-msvc
            tauri_args: --target x86_64-pc-windows-msvc --bundles nsis,msi
          - name: Linux x64
            platform: ubuntu-22.04
            rust_targets: x86_64-unknown-linux-gnu
            tauri_args: --target x86_64-unknown-linux-gnu --bundles appimage,deb

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build desktop package
        uses: tauri-apps/tauri-action@v1
        with:
          uploadWorkflowArtifacts: true
          args: ${{ matrix.tauri_args }}

  package-extension:
    name: Package Chrome extension
    needs: prepare-release
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Test extension
        run: npm run test:extension

      - name: Package extension
        run: npm run package:extension

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Koi-Capture
          path: releases/Koi-Capture-*.zip
          if-no-files-found: error

  attach-release-assets:
    name: Attach successful packages to release
    needs:
      - prepare-release
      - build-desktop
      - package-extension
    if: always() && needs.prepare-release.result == 'success' && (startsWith(github.ref, 'refs/tags/') || inputs.release_tag != '')
    runs-on: ubuntu-22.04
    steps:
      - name: Download successful build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Attach packages to release
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_TAG: ${{ inputs.release_tag || github.ref_name }}
        shell: bash
        run: |
          assets=()
          while IFS= read -r -d '' asset; do
            assets+=("${asset}")
          done < <(
            find release-assets -type f \
              \( -name '*.dmg' \
              -o -name '*.msi' \
              -o -name '*.exe' \
              -o -name '*.AppImage' \
              -o -name '*.deb' \
              -o -name '*.rpm' \
              -o -name '*.zip' \
              -o -name '*.tar.gz' \
              -o -name '*.sig' \) \
              -print0
          )

          if (( ${#assets[@]} == 0 )); then
            echo "No release packages were produced."
            exit 1
          fi

          printf 'Uploading %s\n' "${assets[@]}"
          gh release upload "${TARGET_TAG}" "${assets[@]}" --clobber
